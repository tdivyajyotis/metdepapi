<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc">
  <title id="title">NodeMCU irrigation and sensing controller schematic</title>
  <desc id="desc">Complete wiring schematic for a 12 volt input, 7805 regulator, LoLin NodeMCU V3, four-channel bidirectional level shifter, ADS1115 ADC, NEO-6M GPS, DS18B20 one-wire bus, 3.3 volt I2C optical and environmental sensors, and two soil moisture analog channels.</desc>
  <defs>
    <style>
      .bg { fill:#f8fafc; }
      .panel { fill:#ffffff; stroke:#334155; stroke-width:2; rx:12; }
      .module { fill:#f8fafc; stroke:#334155; stroke-width:2.5; rx:10; }
      .header { fill:#e2e8f0; stroke:#475569; stroke-width:1.5; rx:5; }
      .title { font:700 29px Arial, sans-serif; fill:#0f172a; }
      .subtitle { font:400 15px Arial, sans-serif; fill:#475569; }
      .h1 { font:700 18px Arial, sans-serif; fill:#0f172a; }
      .h2 { font:700 15px Arial, sans-serif; fill:#0f172a; }
      .txt { font:14px Arial, sans-serif; fill:#1e293b; }
      .small { font:12px Arial, sans-serif; fill:#475569; }
      .pin { font:700 12px Consolas, monospace; fill:#0f172a; }
      .netlabel { font:700 12px Arial, sans-serif; paint-order:stroke; stroke:#f8fafc; stroke-width:4px; stroke-linejoin:round; }
      .wire12 { fill:none; stroke:#991b1b; stroke-width:4; }
      .wire5 { fill:none; stroke:#dc2626; stroke-width:4; }
      .wire33 { fill:none; stroke:#ea580c; stroke-width:4; }
      .gnd { fill:none; stroke:#334155; stroke-width:4; }
      .i2cl { fill:none; stroke:#2563eb; stroke-width:3.5; }
      .i2ch { fill:none; stroke:#7c3aed; stroke-width:3.5; }
      .onewire { fill:none; stroke:#059669; stroke-width:3.5; }
      .uart { fill:none; stroke:#0f766e; stroke-width:3.5; }
      .analog { fill:none; stroke:#0891b2; stroke-width:3.5; }
      .junction { stroke:#ffffff; stroke-width:1.5; }
      .note { fill:#fff7ed; stroke:#f97316; stroke-width:1.5; rx:8; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1600" height="1120"/>
  <text class="title" x="54" y="50">NodeMCU V3 sensor controller — electrical schematic</text>
  <text class="subtitle" x="54" y="78">Female headers for modules/connectors; barrel jack and 7805 are soldered. All grounds are common.</text>

  <!-- Legend -->
  <g transform="translate(1045,28)">
    <rect class="panel" x="0" y="0" width="500" height="72"/>
    <line class="wire5" x1="18" y1="23" x2="55" y2="23"/><text class="small" x="63" y="27">5 V</text>
    <line class="wire33" x1="120" y1="23" x2="157" y2="23"/><text class="small" x="165" y="27">3.3 V</text>
    <line class="gnd" x1="230" y1="23" x2="267" y2="23"/><text class="small" x="275" y="27">GND</text>
    <line class="i2cl" x1="342" y1="23" x2="379" y2="23"/><text class="small" x="387" y="27">3.3 V logic</text>
    <line class="i2ch" x1="18" y1="51" x2="55" y2="51"/><text class="small" x="63" y="55">5 V logic</text>
    <line class="onewire" x1="144" y1="51" x2="181" y2="51"/><text class="small" x="189" y="55">1-Wire</text>
    <line class="uart" x1="270" y1="51" x2="307" y2="51"/><text class="small" x="315" y="55">GPS UART</text>
    <line class="analog" x1="405" y1="51" x2="442" y2="51"/><text class="small" x="450" y="55">Analog</text>
  </g>

  <!-- POWER ENTRY -->
  <g>
    <rect class="module" x="54" y="138" width="130" height="104"/>
    <text class="h1" x="119" y="164" text-anchor="middle">J1</text>
    <text class="h2" x="119" y="184" text-anchor="middle">12 V barrel</text>
    <circle cx="87" cy="211" r="5" fill="#991b1b"/><text class="pin" x="99" y="215">CENTER +</text>
    <circle cx="87" cy="231" r="5" fill="#334155"/><text class="pin" x="99" y="235">SLEEVE −</text>

    <rect class="module" x="246" y="150" width="164" height="80"/>
    <text class="h1" x="328" y="176" text-anchor="middle">U1 · 7805</text>
    <text class="pin" x="260" y="210">IN</text><text class="pin" x="321" y="210">GND</text><text class="pin" x="378" y="210">OUT</text>
    <path class="wire12" d="M87 211 H216 V198 H246"/>
    <text class="netlabel" x="194" y="204" fill="#991b1b">+12 V</text>
    <path class="gnd" d="M87 231 H214 V1010"/>
    <path class="gnd" d="M328 230 V1010"/>

    <!-- 7805 bypass capacitors -->
    <path class="wire12" d="M216 198 V270"/>
    <line x1="202" y1="270" x2="230" y2="270" stroke="#334155" stroke-width="3"/>
    <line x1="202" y1="279" x2="230" y2="279" stroke="#334155" stroke-width="3"/>
    <path class="gnd" d="M216 279 V1010"/>
    <text class="pin" x="170" y="300">C1 0.33 µF</text>

    <path class="wire5" d="M410 198 H1495"/>
    <text class="netlabel" x="432" y="188" fill="#dc2626">+5 V BUS</text>
    <path class="wire5" d="M458 198 V270"/>
    <line x1="444" y1="270" x2="472" y2="270" stroke="#334155" stroke-width="3"/>
    <line x1="444" y1="279" x2="472" y2="279" stroke="#334155" stroke-width="3"/>
    <path class="gnd" d="M458 279 V1010"/>
    <text class="pin" x="423" y="300">C2 0.1 µF</text>

    <path class="wire5" d="M520 198 V270"/>
    <line x1="506" y1="270" x2="534" y2="270" stroke="#334155" stroke-width="3"/>
    <line x1="506" y1="279" x2="534" y2="279" stroke="#334155" stroke-width="3"/>
    <path class="gnd" d="M520 279 V1010"/>
    <text class="pin" x="485" y="318">C3 470 µF</text>
    <text class="small" x="488" y="334">recommended bulk</text>
  </g>

  <!-- NODEMCU -->
  <g>
    <rect class="module" x="355" y="370" width="310" height="310"/>
    <text class="h1" x="510" y="401" text-anchor="middle">LoLin NodeMCU V3</text>
    <text class="small" x="510" y="421" text-anchor="middle">ESP8266 · plugged into female headers</text>

    <rect class="header" x="375" y="446" width="94" height="39"/><text class="pin" x="422" y="470" text-anchor="middle">VIN · 5 V</text>
    <rect class="header" x="375" y="498" width="94" height="39"/><text class="pin" x="422" y="522" text-anchor="middle">3V3 OUT</text>
    <rect class="header" x="375" y="550" width="94" height="39"/><text class="pin" x="422" y="574" text-anchor="middle">G · GND</text>

    <rect class="header" x="550" y="446" width="95" height="39"/><text class="pin" x="597" y="470" text-anchor="middle">D1 GPIO5</text>
    <rect class="header" x="550" y="498" width="95" height="39"/><text class="pin" x="597" y="522" text-anchor="middle">D2 GPIO4</text>
    <rect class="header" x="550" y="550" width="95" height="39"/><text class="pin" x="597" y="574" text-anchor="middle">D5 GPIO14</text>
    <rect class="header" x="550" y="602" width="95" height="39"/><text class="pin" x="597" y="626" text-anchor="middle">D6 GPIO12</text>

    <path class="wire5" d="M422 446 V198"/>
    <path class="wire33" d="M422 537 V724 H745"/>
    <text class="netlabel" x="477" y="714" fill="#ea580c">+3.3 V BUS</text>
    <path class="gnd" d="M422 589 V1010"/>
  </g>

  <!-- LEVEL SHIFTER -->
  <g>
    <rect class="module" x="760" y="354" width="290" height="340"/>
    <text class="h1" x="905" y="384" text-anchor="middle">4-channel bidirectional</text>
    <text class="h1" x="905" y="407" text-anchor="middle">logic-level converter</text>
    <text class="small" x="905" y="428" text-anchor="middle">BSS138-style module</text>

    <rect x="779" y="446" width="91" height="197" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
    <text class="h2" x="824" y="470" text-anchor="middle">LOW SIDE</text>
    <text class="pin" x="824" y="504" text-anchor="middle">L1 · SCL</text>
    <text class="pin" x="824" y="550" text-anchor="middle">L2 · SDA</text>
    <text class="pin" x="824" y="596" text-anchor="middle">L3 · GPS RX</text>
    <text class="pin" x="824" y="628" text-anchor="middle">L4 · spare</text>

    <rect x="940" y="446" width="91" height="197" rx="8" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.5"/>
    <text class="h2" x="986" y="470" text-anchor="middle">HIGH SIDE</text>
    <text class="pin" x="986" y="504" text-anchor="middle">H1 · SCL</text>
    <text class="pin" x="986" y="550" text-anchor="middle">H2 · SDA</text>
    <text class="pin" x="986" y="596" text-anchor="middle">H3 · GPS TX</text>
    <text class="pin" x="986" y="628" text-anchor="middle">H4 · spare</text>

    <path class="wire33" d="M745 724 H795 V694"/>
    <text class="pin" x="787" y="681">LV</text>
    <path class="wire5" d="M905 198 V339 H905 V354"/>
    <text class="pin" x="913" y="346">HV</text>
    <path class="gnd" d="M1014 694 V1010"/>
    <text class="pin" x="987" y="681">GND</text>

    <path class="i2cl" d="M645 465 H779"/>
    <path class="i2cl" d="M645 517 H730 V543 H779"/>
    <path class="uart" d="M645 621 H704 V589 H779"/>
    <path class="i2ch" d="M870 497 H940"/>
    <path class="i2ch" d="M870 543 H940"/>
    <path class="uart" d="M940 589 H1031"/>
  </g>

  <!-- ADS1115 -->
  <g>
    <rect class="module" x="1190" y="474" width="278" height="190"/>
    <text class="h1" x="1329" y="503" text-anchor="middle">ADS1115 breakout</text>
    <text class="small" x="1329" y="524" text-anchor="middle">5 V supply · PGA set to ±6.144 V</text>
    <text class="pin" x="1210" y="558">VDD</text><text class="pin" x="1210" y="584">GND</text>
    <text class="pin" x="1385" y="558">SCL</text><text class="pin" x="1385" y="584">SDA</text>
    <text class="pin" x="1210" y="626">A0</text><text class="pin" x="1285" y="626">A1</text>
    <path class="wire5" d="M1238 550 V198"/>
    <path class="gnd" d="M1238 577 V1010"/>
    <path class="i2ch" d="M1125 550 H1380"/>
    <path class="i2ch" d="M1145 577 H1380"/>
  </g>

  <!-- GPS -->
  <g>
    <rect class="module" x="1190" y="694" width="278" height="150"/>
    <text class="h1" x="1329" y="723" text-anchor="middle">NEO-6M GPS breakout</text>
    <text class="small" x="1329" y="744" text-anchor="middle">female 4-pin connection</text>
    <text class="pin" x="1210" y="778">VCC</text><text class="pin" x="1210" y="804">GND</text>
    <text class="pin" x="1385" y="778">TX</text><text class="pin" x="1385" y="804">RX · NC</text>
    <path class="wire5" d="M1238 770 V198"/>
    <path class="gnd" d="M1238 797 V1010"/>
    <path class="uart" d="M1031 589 H1100 V770 H1380"/>
    <text class="netlabel" x="1050" y="580" fill="#0f766e">GPS → ESP</text>
  </g>

  <!-- LOW-SIDE I2C EXPANSION HEADER -->
  <g>
    <rect class="module" x="760" y="784" width="290" height="150"/>
    <text class="h1" x="905" y="813" text-anchor="middle">J2 · 3.3 V I²C bus</text>
    <text class="small" x="905" y="834" text-anchor="middle">SHT45 + TSL2584 ×2 + TCS3448</text>
    <rect class="header" x="785" y="855" width="240" height="45"/>
    <text class="pin" x="815" y="882">1 3V3</text>
    <text class="pin" x="873" y="882">2 GND</text>
    <text class="pin" x="937" y="882">3 SDA</text>
    <text class="pin" x="989" y="882">4 SCL</text>
    <path class="wire33" d="M815 900 V940 H745 V724"/>
    <path class="gnd" d="M883 900 V1010"/>
    <path class="i2cl" d="M956 900 V957 H730 V543"/>
    <path class="i2cl" d="M1005 900 V973 H714 V465"/>
  </g>

  <!-- 1-WIRE CONNECTOR -->
  <g>
    <rect class="module" x="355" y="784" width="310" height="150"/>
    <text class="h1" x="510" y="813" text-anchor="middle">J3 · DS18B20 1-Wire bus</text>
    <text class="small" x="510" y="834" text-anchor="middle">female 3-pin connector · 3 m cable</text>
    <rect class="header" x="390" y="855" width="240" height="45"/>
    <text class="pin" x="420" y="882">1 3V3</text>
    <text class="pin" x="486" y="882">2 DATA</text>
    <text class="pin" x="565" y="882">3 GND</text>
    <path class="wire33" d="M420 855 V724"/>
    <path class="onewire" d="M520 855 V750 H704 V569 H645"/>
    <path class="gnd" d="M585 900 V1010"/>
    <!-- pull-up -->
    <path class="wire33" d="M470 724 V746"/>
    <path d="M470 746 l-8 8 16 10 -16 10 16 10 -16 10 8 8" fill="none" stroke="#059669" stroke-width="3"/>
    <path class="onewire" d="M470 802 V830 H520"/>
    <text class="pin" x="398" y="780">R1 · 4.7 kΩ</text>
  </g>

  <!-- SOIL CONNECTOR -->
  <g>
    <rect class="module" x="1190" y="874" width="278" height="105"/>
    <text class="h1" x="1329" y="901" text-anchor="middle">J4 · Soil moisture</text>
    <text class="small" x="1329" y="921" text-anchor="middle">female 4-pin · LM393 boards</text>
    <text class="pin" x="1208" y="955">1 5V</text>
    <text class="pin" x="1260" y="955">2 GND</text>
    <text class="pin" x="1330" y="955">3 AO1</text>
    <text class="pin" x="1400" y="955">4 AO2</text>
    <path class="wire5" d="M1227 944 V198"/>
    <path class="gnd" d="M1290 944 V1010"/>
    <path class="analog" d="M1235 618 H1165 V942 H1353"/>
    <path class="analog" d="M1310 618 H1175 V965 H1423 V944"/>
  </g>

  <!-- Ground bus -->
  <path class="gnd" d="M54 1010 H1495"/>
  <text class="netlabel" x="66" y="1001" fill="#334155">COMMON GROUND BUS</text>
  <circle class="junction" cx="214" cy="1010" r="5" fill="#334155"/>
  <circle class="junction" cx="328" cy="1010" r="5" fill="#334155"/>
  <circle class="junction" cx="422" cy="1010" r="5" fill="#334155"/>
  <circle class="junction" cx="458" cy="1010" r="5" fill="#334155"/>
  <circle class="junction" cx="520" cy="1010" r="5" fill="#334155"/>
  <circle class="junction" cx="585" cy="1010" r="5" fill="#334155"/>
  <circle class="junction" cx="883" cy="1010" r="5" fill="#334155"/>
  <circle class="junction" cx="1014" cy="1010" r="5" fill="#334155"/>
  <circle class="junction" cx="1238" cy="1010" r="5" fill="#334155"/>
  <circle class="junction" cx="1290" cy="1010" r="5" fill="#334155"/>

  <!-- Build notes -->
  <g>
    <rect class="note" x="54" y="1037" width="1491" height="60"/>
    <text class="h2" x="72" y="1061">Build notes</text>
    <text class="txt" x="72" y="1084">I²C speed: 100 kHz maximum. Mount C1/C2 beside the 7805. Use a heatsink or a cooler 12 V→5 V buck regulator. GPS RX is unused.</text>
  </g>
</svg>
