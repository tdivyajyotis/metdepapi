<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#071521">
  <title>TurtleGuard Environmental Station</title>
  <style>
    :root { color-scheme: dark; --bg:#071521; --panel:#0c2130; --line:#234354; --text:#edf8f6; --muted:#91adb5; --cyan:#45d9d0; --green:#75d796; --amber:#f2c56b; --red:#ff7b79; font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; }
    * { box-sizing:border-box; }
    body { margin:0; min-width:320px; color:var(--text); background:radial-gradient(circle at 12% 0%,rgba(69,217,208,.12),transparent 28rem),radial-gradient(circle at 92% 12%,rgba(87,168,255,.1),transparent 30rem),var(--bg); }
    button,select,input { font:inherit; min-height:2.45rem; border:1px solid var(--line); border-radius:.7rem; background:#0a1d2a; color:var(--text); }
    button { cursor:pointer; } button:hover { border-color:var(--cyan); }
    select,input { padding:.52rem .7rem; }
    .shell { width:min(1500px,100%); margin:auto; padding:1.25rem; }
    .topbar { display:flex; align-items:flex-start; justify-content:space-between; gap:1rem; margin-bottom:1rem; }
    .eyebrow { color:var(--cyan); font-size:.72rem; font-weight:800; letter-spacing:.14em; text-transform:uppercase; }
    h1 { margin:.2rem 0 .15rem; font-size:clamp(1.55rem,3vw,2.35rem); line-height:1.05; }
    h2 { margin:0; font-size:1rem; } .subtitle,.muted { color:var(--muted); } .subtitle { font-size:.9rem; }
    .status-line { display:flex; align-items:center; gap:.5rem; margin-top:.65rem; font-size:.84rem; }
    .dot { width:.65rem; height:.65rem; border-radius:50%; background:var(--muted); box-shadow:0 0 0 .25rem rgba(145,173,181,.1); }
    .dot.good { background:var(--green); box-shadow:0 0 0 .25rem rgba(117,215,150,.12); } .dot.warn { background:var(--amber); } .dot.bad { background:var(--red); }
    .toolbar { display:flex; flex-wrap:wrap; justify-content:flex-end; gap:.55rem; }
    .toolbar label { display:grid; gap:.2rem; color:var(--muted); font-size:.68rem; text-transform:uppercase; letter-spacing:.06em; }
    #refresh { align-self:end; padding:.52rem .9rem; background:var(--cyan); color:#032526; border-color:transparent; font-weight:800; }
    .notice { display:none; margin:.85rem 0; padding:.8rem 1rem; border:1px solid rgba(242,197,107,.4); border-radius:.8rem; background:rgba(242,197,107,.08); color:#ffe6ae; } .notice.show { display:block; }
    .summary-grid { display:grid; grid-template-columns:repeat(6,minmax(0,1fr)); gap:.7rem; margin:1rem 0; }
    .summary-card,.panel,.metric-card { border:1px solid var(--line); background:linear-gradient(145deg,rgba(16,42,58,.94),rgba(9,29,42,.96)); box-shadow:0 16px 42px rgba(0,0,0,.22); }
    .summary-card { min-width:0; border-radius:.9rem; padding:.85rem; }
    .summary-label { color:var(--muted); font-size:.7rem; text-transform:uppercase; letter-spacing:.07em; }
    .summary-value { margin-top:.28rem; font-size:1.05rem; font-weight:750; overflow-wrap:anywhere; }
    .summary-detail { color:var(--muted); font-size:.72rem; margin-top:.22rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .panel { border-radius:1rem; padding:1rem; margin:.8rem 0; }
    .panel-heading { display:flex; align-items:center; justify-content:space-between; gap:1rem; margin-bottom:.8rem; }
    .health-strip,.filters { display:flex; flex-wrap:wrap; gap:.45rem; }
    .pill { display:inline-flex; align-items:center; gap:.35rem; padding:.38rem .58rem; border:1px solid var(--line); border-radius:999px; font-size:.73rem; color:var(--muted); background:rgba(3,17,26,.35); }
    .pill::before { content:""; width:.42rem; height:.42rem; border-radius:50%; background:var(--muted); } .pill.good { color:#c8f5d5; border-color:rgba(117,215,150,.35); } .pill.good::before { background:var(--green); } .pill.bad { color:#ffd0ce; border-color:rgba(255,123,121,.35); } .pill.bad::before { background:var(--red); } .pill.stale { color:#ffe6ae; border-color:rgba(242,197,107,.45); background:rgba(242,197,107,.08); } .pill.stale::before { background:var(--amber); } .pill.unknown { color:var(--muted); }
    .chart-tools { display:flex; flex-wrap:wrap; align-items:center; gap:.5rem; margin-bottom:.8rem; } #metric-search { flex:1 1 15rem; }
    .filter { min-height:auto; padding:.4rem .65rem; color:var(--muted); font-size:.75rem; } .filter.active { background:var(--cyan); border-color:var(--cyan); color:#032526; font-weight:800; }
    .metric-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(225px,1fr)); gap:.7rem; }
    .metric-card { min-width:0; border-radius:.85rem; padding:.75rem; }
    .metric-top { display:flex; align-items:flex-start; justify-content:space-between; gap:.5rem; }
    .metric-name { color:#c8dcdf; font-size:.76rem; line-height:1.25; min-height:2em; }
    .metric-value { margin-top:.2rem; font-size:1.42rem; font-weight:800; font-variant-numeric:tabular-nums; } .metric-value small { font-size:.72rem; color:var(--muted); }
    .metric-age { color:var(--muted); font-size:.66rem; white-space:nowrap; }
    .spark { display:block; width:100%; height:76px; margin:.45rem 0 .2rem; overflow:visible; }
    .spark .gridline { stroke:rgba(145,173,181,.16); stroke-width:1; } .spark .area { fill:rgba(69,217,208,.11); } .spark .line { fill:none; stroke:var(--cyan); stroke-width:2.5; vector-effect:non-scaling-stroke; } .spark .point { fill:var(--cyan); stroke:#08202b; stroke-width:2; vector-effect:non-scaling-stroke; }
    .metric-foot { display:flex; justify-content:space-between; gap:.5rem; color:var(--muted); font-size:.65rem; font-variant-numeric:tabular-nums; }
    .empty { padding:2.2rem 1rem; color:var(--muted); text-align:center; }
    details { border-top:1px solid var(--line); margin-top:.75rem; padding-top:.7rem; } summary { cursor:pointer; color:#cfe5e6; font-weight:700; }
    .telemetry-console { max-height:32rem; overflow:auto; margin:.7rem 0 0; padding:.9rem; border-radius:.7rem; background:#041019; color:#cfe0e5; font:12px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace; white-space:pre-wrap; overflow-wrap:anywhere; }
    .table-wrap { overflow-x:auto; } table { width:100%; border-collapse:collapse; font-size:.78rem; } th,td { padding:.62rem .55rem; text-align:left; white-space:nowrap; border-bottom:1px solid rgba(35,67,84,.65); } th { color:var(--muted); font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; }
    .reading-row { cursor:pointer; } .reading-row:hover td { background:rgba(69,217,208,.045); } .reading-row.expanded td { background:rgba(69,217,208,.075); }
    .expand-button { display:grid; place-items:center; width:1.85rem; min-height:1.85rem; padding:0; border-radius:50%; color:var(--cyan); background:transparent; font-size:1.05rem; transition:transform .15s ease; } .expand-button[aria-expanded="true"] { transform:rotate(90deg); }
    .reading-detail td { padding:0; white-space:normal; background:#071923; }
    .request-panel { padding:1rem; border-bottom:1px solid var(--line); }
    .request-heading { display:flex; flex-wrap:wrap; align-items:baseline; justify-content:space-between; gap:.5rem; margin-bottom:.75rem; } .request-heading strong { color:#d8eff0; }
    .telemetry-groups { display:grid; grid-template-columns:repeat(auto-fit,minmax(235px,1fr)); gap:.65rem; }
    .telemetry-group { min-width:0; padding:.75rem; border:1px solid rgba(35,67,84,.8); border-radius:.75rem; background:rgba(3,17,26,.36); }
    .telemetry-group h3 { margin:0 0 .5rem; color:var(--cyan); font-size:.72rem; letter-spacing:.07em; text-transform:uppercase; }
    .telemetry-list { display:grid; grid-template-columns:minmax(7rem,auto) 1fr; gap:.3rem .65rem; margin:0; font-size:.72rem; } .telemetry-list dt { color:var(--muted); } .telemetry-list dd { min-width:0; margin:0; color:#d8e7e9; overflow-wrap:anywhere; font-variant-numeric:tabular-nums; }
    .ok-text { color:var(--green); } .bad-text { color:var(--red); }
    @media (max-width:1050px) { .summary-grid { grid-template-columns:repeat(3,minmax(0,1fr)); } }
    @media (max-width:680px) { .shell{padding:.8rem}.topbar{display:block}.toolbar{justify-content:stretch;margin-top:1rem}.toolbar label{flex:1 1 9rem}.toolbar select{width:100%}#refresh{flex:1 1 100%}.summary-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.metric-grid{grid-template-columns:1fr} }
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div><div class="eyebrow">TurtleGuard · Field telemetry</div><h1>Environmental station</h1><div class="subtitle">Sensor conditions, directional light and station health in IST</div><div class="status-line"><span id="status-dot" class="dot"></span><span id="status">Loading station data…</span></div></div>
      <div class="toolbar"><label>Device<select id="device"></select></label><label>History<select id="history"><option value="30">30 min</option><option value="60">1 hour</option><option value="180" selected>3 hours</option><option value="360">6 hours</option></select></label><button id="refresh" type="button">Refresh now</button></div>
    </header>
    <div id="notice" class="notice" role="status"></div>
    <section id="summary" class="summary-grid" aria-label="Station summary"></section>
    <section class="panel" aria-labelledby="health-heading"><div class="panel-heading"><h2 id="health-heading">Hardware health</h2><span id="last-update" class="muted"></span></div><div id="health" class="health-strip"></div></section>
    <section class="panel" aria-labelledby="charts-heading">
      <div class="panel-heading"><h2 id="charts-heading">Sensor trends</h2><span id="chart-count" class="muted"></span></div>
      <div class="chart-tools"><input id="metric-search" type="search" placeholder="Find temperature, sea light, 550 nm…" aria-label="Filter sensor charts"><div id="filters" class="filters" aria-label="Chart categories"></div></div>
      <div id="metrics" class="metric-grid"></div>
    </section>
    <section class="panel" aria-labelledby="readings-heading">
      <div class="panel-heading"><h2 id="readings-heading">Recent arrivals</h2><span class="muted">Ordered by server receipt time</span></div>
      <div class="table-wrap"><table><thead><tr><th aria-label="Expand request"></th><th>Received</th><th>Observed</th><th>Sequence</th><th>Firmware</th><th>RSSI</th><th>Uno link</th></tr></thead><tbody id="readings"></tbody></table></div>
    </section>
  </main>
  <script>
    const $ = id => document.getElementById(id);
    const IST_FORMAT = new Intl.DateTimeFormat('en-IN',{timeZone:'Asia/Kolkata',year:'numeric',month:'short',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:true});
    const TELEMETRY_STALE_AFTER_MS = 150000;
    const state = {readings:[],newest:null,category:'all',search:'',expanded:new Set()};
    const CATEGORIES = [['all','All'],['climate','Temperature & humidity'],['soil','Soil'],['optical','Light & spectrum'],['location','GPS'],['other','Other']];
    const STATIC_FIELDS = /\.(sensor_id|depth_cm|channel|address|sample_count|uno_sequence|fix_age_ms|system_epoch|rtc_epoch)$/;
    const escapeHtml = value => String(value ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const formatIst = value => value ? `${IST_FORMAT.format(new Date(value))} IST` : '—';
    const json = async url => { const response=await fetch(url,{cache:'no-store'}); if(!response.ok) throw new Error(`${response.status} ${response.statusText}`); return response.json(); };
    const effectiveTime = reading => { const received=new Date(reading.received_at).getTime(),observed=new Date(reading.observed_at).getTime(); return Number.isFinite(observed)&&Math.abs(observed-received)<=300000?observed:received; };
    const receivedTime = reading => new Date(reading?.received_at).getTime();
    const telemetryIsStale = reading => { const received=receivedTime(reading); return !Number.isFinite(received)||Date.now()-received>TELEMETRY_STALE_AFTER_MS; };
    function numericLeaves(value,prefix='',out=[]) { if(Array.isArray(value)) value.forEach((item,index)=>numericLeaves(item,prefix?`${prefix}.${index}`:String(index),out)); else if(value&&typeof value==='object') Object.entries(value).forEach(([key,item])=>numericLeaves(item,prefix?`${prefix}.${key}`:key,out)); else if(typeof value==='number'&&Number.isFinite(value)) out.push([prefix,value]); return out; }
    const isChartMetric = path => !path.startsWith('timekeeping.')&&!STATIC_FIELDS.test(path);
    const categoryFor = path => path.startsWith('ds18b20.')||path.startsWith('sht45.')?'climate':path.startsWith('soil_moisture.')?'soil':path.startsWith('tsl2584_')||path.startsWith('tcs3448.')?'optical':path.startsWith('gps.')?'location':'other';
    const unitFor = path => path.endsWith('temperature_c')?'°C':path.endsWith('humidity_pct')||path.endsWith('moisture_pct')?'%':path.endsWith('voltage_v')?'V':path.endsWith('altitude_m')?'m':path.endsWith('latitude_deg')||path.endsWith('longitude_deg')?'°':path.includes('counts')||/tcs3448\.(visible|f\w+)/.test(path)?'count':'';
    const prettify = value => value.replace(/_/g,' ').replace(/\b\w/g,letter=>letter.toUpperCase());
    function metricLabel(path) { const parts=path.split('.'),latest=state.newest?.sensors||{}; if(parts[0]==='ds18b20'){const sensor=latest.ds18b20?.[Number(parts[1])]||{};return `${prettify(parts[2]||'reading')} · DS${sensor.sensor_id||Number(parts[1])+1}${sensor.depth_cm==null?'':` · ${sensor.depth_cm} cm`}`;} if(parts[0]==='soil_moisture'){const sensor=latest.soil_moisture?.[Number(parts[1])]||{};return `${prettify(parts[2]||'reading')} · ${sensor.uno_pin||`channel ${parts[1]}`}${sensor.depth_cm==null?'':` · ${sensor.depth_cm} cm`}`;} if(parts[0]==='tsl2584_sea')return `${prettify(parts.slice(1).join(' '))} · Sea-facing light`; if(parts[0]==='tsl2584_land')return `${prettify(parts.slice(1).join(' '))} · Land-facing light`; if(parts[0]==='tcs3448')return `${prettify(parts.slice(1).join(' '))} · Spectrum`; if(parts[0]==='sht45')return `${prettify(parts.slice(1).join(' '))} · Air`; if(parts[0]==='gps')return `${prettify(parts.slice(1).join(' '))} · GPS`; return prettify(path); }
    function formatNumber(value,unit='') { const abs=Math.abs(value),digits=unit==='count'||Number.isInteger(value)?0:abs>=100?1:abs>=10?2:3; return Number(value).toLocaleString('en-IN',{maximumFractionDigits:digits}); }
    function ageText(timestamp) { const seconds=Math.max(0,Math.round((Date.now()-timestamp)/1000)); return seconds<60?`${seconds}s ago`:seconds<3600?`${Math.floor(seconds/60)}m ago`:`${Math.floor(seconds/3600)}h ago`; }
    function sparkline(points) { const width=320,height=76,pad=5,values=points.map(point=>point.value);let min=Math.min(...values),max=Math.max(...values);if(min===max){min-=Math.max(1,Math.abs(min)*.02);max+=Math.max(1,Math.abs(max)*.02);}const coordinates=points.map((point,index)=>[pad+index*(width-pad*2)/Math.max(1,points.length-1),height-pad-(point.value-min)*(height-pad*2)/(max-min)]),line=coordinates.map(point=>point.join(',')).join(' '),area=`${pad},${height-pad} ${line} ${width-pad},${height-pad}`,last=coordinates.at(-1);return `<svg class="spark" viewBox="0 0 ${width} ${height}" preserveAspectRatio="none" role="img" aria-label="Trend"><line class="gridline" x1="${pad}" y1="${height/2}" x2="${width-pad}" y2="${height/2}"/><polygon class="area" points="${area}"/><polyline class="line" points="${line}"/><circle class="point" cx="${last[0]}" cy="${last[1]}" r="3.5"/></svg>`; }
    function buildSeries(readings) { const series=new Map();[...readings].reverse().forEach(reading=>numericLeaves(reading.sensors).filter(([path])=>isChartMetric(path)).forEach(([path,value])=>{if(!series.has(path))series.set(path,[]);series.get(path).push({time:effectiveTime(reading),value});}));return series; }
    function renderMetricCards() { const series=buildSeries(state.readings),query=state.search.toLowerCase(),cards=[...series.entries()].map(([path,points])=>({path,points,label:metricLabel(path),category:categoryFor(path)})).filter(item=>(state.category==='all'||item.category===state.category)&&(!query||`${item.label} ${item.path}`.toLowerCase().includes(query))).sort((a,b)=>a.category.localeCompare(b.category)||a.label.localeCompare(b.label));$('chart-count').textContent=`${cards.length} chart${cards.length===1?'':'s'}`;$('metrics').innerHTML=cards.length?cards.map(item=>{const unit=unitFor(item.path),values=item.points.map(point=>point.value),last=item.points.at(-1);return `<article class="metric-card"><div class="metric-top"><div><div class="metric-name">${escapeHtml(item.label)}</div><div class="metric-value">${escapeHtml(formatNumber(last.value,unit))}${unit?` <small>${escapeHtml(unit)}</small>`:''}</div></div><span class="metric-age">${escapeHtml(ageText(last.time))}</span></div>${sparkline(item.points)}<div class="metric-foot"><span>min ${escapeHtml(formatNumber(Math.min(...values),unit))}</span><span>${item.points.length} samples</span><span>max ${escapeHtml(formatNumber(Math.max(...values),unit))}</span></div></article>`;}).join(''):'<div class="empty">No matching numeric sensor channels.</div>'; }
    function renderFilters() { $('filters').innerHTML=CATEGORIES.map(([id,label])=>`<button class="filter${state.category===id?' active':''}" type="button" data-filter="${id}">${escapeHtml(label)}</button>`).join(''); }
    function renderSummary(reading) { const telemetry=reading.telemetry||{},presence=telemetry.sensor_presence||{},link=telemetry.uno_link||{},timing=telemetry.timekeeping||{},present=['sht45','ds3231','tcs3448','tsl2584_sea','tsl2584_land'].filter(key=>presence[key]).length+Number(presence.ds18b20_mapped_present||0),configured=5+Number(presence.ds18b20_configured||0),cards=[['Last received',formatIst(reading.received_at),ageText(new Date(reading.received_at).getTime())],['Station firmware',reading.firmware||'—',`sequence ${reading.sequence??'—'}`],['Sensors online',`${present}/${configured}`,present===configured?'all detected':'station degraded'],['Uno link',link.telemetry_available?'Connected':'Unavailable',`${link.successes||0} success · ${link.timeouts||0} timeout`],['Clock',String(timing.source||reading.sensors?.timekeeping?.source||'unknown').toUpperCase(),timing.system_ist||reading.sensors?.timekeeping?.ist||'IST'],['Wi-Fi',`${reading.wifi_rssi_dbm??telemetry.wifi?.rssi_dbm??'—'} dBm`,telemetry.wifi?.status_name||'unknown']];$('summary').innerHTML=cards.map(([label,value,detail])=>`<div class="summary-card"><div class="summary-label">${escapeHtml(label)}</div><div class="summary-value">${escapeHtml(value)}</div><div class="summary-detail">${escapeHtml(detail)}</div></div>`).join(''); }
    function renderHealth(reading) {
      const telemetry=reading.telemetry||{},presence=telemetry.sensor_presence||{},link=telemetry.uno_link||{};
      const httpStatus=Number(telemetry.http?.last_status),dsConfigured=Number(presence.ds18b20_configured),dsPresent=Number(presence.ds18b20_mapped_present);
      const stale=telemetryIsStale(reading),age=ageText(receivedTime(reading));
      const priorHttp=Number.isFinite(httpStatus)&&httpStatus>0?` Device reported HTTP ${httpStatus} for its previous POST.`:' No previous device HTTP status was reported.';
      const entries=[
        ['DS18B20',Number.isFinite(dsConfigured)&&dsConfigured>0&&Number.isFinite(dsPresent)?dsPresent===dsConfigured:null],
        ['SHT45',typeof presence.sht45==='boolean'?presence.sht45:null],
        ['TSL sea',typeof presence.tsl2584_sea==='boolean'?presence.tsl2584_sea:null],
        ['TSL land',typeof presence.tsl2584_land==='boolean'?presence.tsl2584_land:null],
        ['TCS3448',typeof presence.tcs3448==='boolean'?presence.tcs3448:null],
        ['DS3231',typeof presence.ds3231==='boolean'?presence.ds3231:null],
        ['Uno link',typeof link.telemetry_available==='boolean'?link.telemetry_available:null],
        ['TLS trust store',typeof telemetry.tls?.cert_store_ready==='boolean'?telemetry.tls.cert_store_ready:null],
        ['API ingest',true,`This reading reached and was returned by the ingestion API.${priorHttp}`]
      ];
      const freshness=`<span class="pill ${stale?'stale':'good'}" title="Freshness is based on server receipt time">Telemetry ${stale?`stale · ${age}`:'fresh'}</span>`;
      const components=entries.map(([label,ok,detail])=>{const known=typeof ok==='boolean',klass=stale?'stale':known?(ok?'good':'bad'):'unknown',stateText=known?(ok?'healthy':'unhealthy'):'unknown',text=stale?`${label} · stale`:label,title=stale?`Last known state: ${stateText}; telemetry received ${age}. ${detail||''}`:detail||`Current reported state: ${stateText}`;return `<span class="pill ${klass}" title="${escapeHtml(title)}">${escapeHtml(text)}</span>`;}).join('');
      $('health').innerHTML=freshness+components;
      $('last-update').textContent=stale?`Stale · last telemetry ${age}`:`Fresh · received ${age}`;
    }
    function readableValue(value) { if(value===true)return 'Yes';if(value===false)return 'No';if(value===null||value===undefined||value==='')return '—';return String(value); }
    function durationText(milliseconds) { const seconds=Math.max(0,Math.round(Number(milliseconds||0)/1000));return seconds<60?`${seconds}s`:`${Math.floor(seconds/60)}m ${seconds%60}s`; }
    function telemetryGroup(title,pairs) { return `<section class="telemetry-group"><h3>${escapeHtml(title)}</h3><dl class="telemetry-list">${pairs.map(([label,value])=>`<dt>${escapeHtml(label)}</dt><dd>${escapeHtml(readableValue(value))}</dd>`).join('')}</dl></section>`; }
    function humanTelemetry(reading) {
      const telemetry=reading.telemetry||{},node=telemetry.nodemcu||{},wifi=telemetry.wifi||{},tls=telemetry.tls||{},presence=telemetry.sensor_presence||{},link=telemetry.uno_link||{},uno=telemetry.uno||{},http=telemetry.http||{},clock=telemetry.timekeeping||{},gps=reading.sensors?.gps||{},i2c=telemetry.i2c||{};
      const addresses=Array.isArray(i2c.addresses)?i2c.addresses.map(address=>`0x${Number(address).toString(16).toUpperCase().padStart(2,'0')}`).join(', '):'—';
      return [
        telemetryGroup('Request',[['Server received',formatIst(reading.received_at)],['Device observed',formatIst(reading.observed_at||reading.received_at)],['Event ID',reading.event_id],['Sequence',reading.sequence],['Payload firmware',reading.firmware],['Telemetry age',ageText(receivedTime(reading))]]),
        telemetryGroup('NodeMCU',[['Firmware',node.firmware],['Boot ID',node.boot_id],['Reset reason',node.reset_reason],['Free heap',node.free_heap_bytes==null?'—':`${Number(node.free_heap_bytes).toLocaleString('en-IN')} bytes`],['Heap fragmentation',node.heap_fragmentation_pct==null?'—':`${node.heap_fragmentation_pct}%`],['CPU',node.cpu_mhz==null?'—':`${node.cpu_mhz} MHz`]]),
        telemetryGroup('Network and delivery',[['Wi-Fi connected',wifi.connected],['IP address',wifi.ip],['RSSI',wifi.rssi_dbm==null?reading.wifi_rssi_dbm==null?'—':`${reading.wifi_rssi_dbm} dBm`:`${wifi.rssi_dbm} dBm`],['Wi-Fi channel',wifi.channel],['TLS verification required',tls.verification_required],['Trust anchors',tls.trust_anchor_count],['Previous HTTP status',http.last_status||'none yet'],['POST successes / failures',`${http.successes||0} / ${http.failures||0}`]]),
        telemetryGroup('Sensor discovery',[['DS18B20 mapped',`${presence.ds18b20_mapped_present??'—'} / ${presence.ds18b20_configured??'—'}`],['SHT45',presence.sht45],['TSL sea',presence.tsl2584_sea],['TSL land',presence.tsl2584_land],['TCS3448',presence.tcs3448],['DS3231',presence.ds3231],['I²C devices',i2c.device_count],['I²C addresses',addresses]]),
        telemetryGroup('Uno link',[['Available',link.telemetry_available],['Requests',link.requests],['Successes',link.successes],['Timeouts',link.timeouts],['Invalid responses',link.invalid_responses],['Last latency',link.last_latency_ms==null?'—':`${link.last_latency_ms} ms`],['Response bytes',link.last_response_bytes],['Uno firmware',uno.firmware]]),
        telemetryGroup('Uno and GPS',[['Uno uptime',uno.uptime_ms==null?'—':durationText(uno.uptime_ms)],['Free SRAM',uno.free_sram_bytes==null?'—':`${uno.free_sram_bytes} bytes`],['ADC samples',uno.adc_samples_completed],['GPS chars',uno.gps_chars_processed],['NMEA accepted',uno.gps_sentences_ok],['NMEA with fix',uno.gps_sentences_with_fix],['Checksum failures',uno.gps_checksum_failures],['Position fix',gps.fix_valid],['GPS time valid',gps.time_valid],['Satellites',gps.satellites]]),
        telemetryGroup('Clock',[['Source',clock.source||reading.sensors?.timekeeping?.source],['System time',clock.system_ist||reading.sensors?.timekeeping?.ist],['RTC last set from',clock.rtc_last_set_source],['RTC time',clock.rtc_ist||reading.sensors?.timekeeping?.rtc_ist],['GPS time fresh',clock.gps_time_fresh],['GPS fix fresh',clock.gps_fix_fresh],['GPS time without fix',clock.gps_time_used_without_fix],['NTP applied',clock.ntp_clock_applied]])
      ].join('');
    }
    function requestConsole(reading,previousReading) {
      const telemetry=reading.telemetry||{},previousTelemetry=previousReading?.telemetry||{},anchor=effectiveTime(reading),captured=Number(telemetry.captured_uptime_ms),events=Array.isArray(telemetry.events)?telemetry.events:[];
      const sameBoot=telemetry.nodemcu?.boot_id!=null&&telemetry.nodemcu?.boot_id===previousTelemetry.nodemcu?.boot_id,previousIds=new Set(sameBoot&&Array.isArray(previousTelemetry.events)?previousTelemetry.events.map(event=>event.id):[]),newEvents=events.filter(event=>!previousIds.has(event.id));
      const lines=newEvents.map(event=>{const eventUptime=Number(event.uptime_ms),time=Number.isFinite(captured)&&Number.isFinite(eventUptime)?anchor-Math.max(0,captured-eventUptime):anchor;return `[${formatIst(time)}] [${event.source||'node'}] [${String(event.level||'info').toUpperCase()}] ${event.message||''} (uptime ${event.uptime_ms??'?'} ms)`;});
      return `NEW EVENT LINES IN THIS REQUEST\n${lines.length?lines.join('\n'):'No new diagnostic events since the preceding request.'}\n\nRAW REQUEST (includes the device\'s bounded event-history snapshot)\n${JSON.stringify(reading,null,2)}`;
    }
    function renderReadings(readings) {
      $('readings').innerHTML=readings.slice(0,12).map((reading,index)=>{const link=reading.telemetry?.uno_link||{},ok=link.telemetry_available,key=String(reading.event_id||`${reading.received_at}-${reading.sequence}`),expanded=state.expanded.has(key),detailId=`request-detail-${index}`,previousReading=readings[index+1];return `<tr class="reading-row${expanded?' expanded':''}" data-request-key="${escapeHtml(key)}" data-detail-id="${detailId}" title="Open telemetry captured with this request"><td><button class="expand-button" type="button" aria-expanded="${expanded}" aria-controls="${detailId}" aria-label="${expanded?'Collapse':'Expand'} request telemetry">›</button></td><td>${escapeHtml(formatIst(reading.received_at))}</td><td>${escapeHtml(formatIst(reading.observed_at||reading.received_at))}</td><td>${escapeHtml(reading.sequence)}</td><td>${escapeHtml(reading.firmware)}</td><td>${escapeHtml(reading.wifi_rssi_dbm??'—')} dBm</td><td class="${ok?'ok-text':'bad-text'}">${ok?'connected':'unavailable'}</td></tr><tr id="${detailId}" class="reading-detail"${expanded?'':' hidden'}><td colspan="7"><div class="request-panel"><div class="request-heading"><strong>Telemetry captured with request ${escapeHtml(reading.event_id||reading.sequence)}</strong><span class="muted">${escapeHtml(formatIst(reading.received_at))}</span></div><div class="telemetry-groups">${humanTelemetry(reading)}</div><details><summary>Console events and complete raw request</summary><p class="muted">Only event lines new since the preceding request are shown first. The raw request preserves the complete bounded event history supplied by the device.</p><pre class="telemetry-console">${escapeHtml(requestConsole(reading,previousReading))}</pre></details></div></td></tr>`;}).join('');
    }
    function toggleRequest(row) { const detail=document.getElementById(row.dataset.detailId),button=row.querySelector('.expand-button'),opening=button.getAttribute('aria-expanded')!=='true';button.setAttribute('aria-expanded',String(opening));button.setAttribute('aria-label',`${opening?'Collapse':'Expand'} request telemetry`);row.classList.toggle('expanded',opening);detail.hidden=!opening;if(opening)state.expanded.add(row.dataset.requestKey);else state.expanded.delete(row.dataset.requestKey); }
    function renderNotice(reading) { const observed=new Date(reading.observed_at).getTime(),received=receivedTime(reading),skew=Math.abs(observed-received),issues=[];if(telemetryIsStale(reading))issues.push(`Health data is stale; the last server receipt was ${ageText(received)}. Last-known green states are not current health.`);if(Number.isFinite(skew)&&skew>300000)issues.push('Device time differs from server receipt time; server time is being used for recency.');if(!reading.telemetry?.uno_link?.telemetry_available)issues.push('Arduino Uno telemetry is unavailable; soil and GPS values may be missing.');$('notice').textContent=issues.join(' ');$('notice').classList.toggle('show',issues.length>0); }
    function updateStatus(reading) { const received=receivedTime(reading),stale=telemetryIsStale(reading),degraded=!reading.telemetry?.uno_link?.telemetry_available;$('status-dot').className=`dot ${stale?'bad':degraded?'warn':'good'}`;$('status').textContent=stale?`Offline or delayed · last report ${ageText(received)}`:degraded?'Online · Uno link degraded':'Online · all systems reporting'; }
    async function load() { $('refresh').disabled=true;try{const devices=(await json('/v1/devices')).items,previous=$('device').value;$('device').innerHTML=devices.map(device=>`<option value="${escapeHtml(device.device_id)}"${device.device_id===previous?' selected':''}>${escapeHtml(device.device_id)}</option>`).join('');const deviceId=$('device').value,limit=Number($('history').value)||180,data=await json(`/v1/readings?limit=${limit}&device_id=${encodeURIComponent(deviceId)}`);state.readings=data.items;state.newest=data.items[0]||null;if(!state.newest)throw new Error('No readings have been received for this device');renderSummary(state.newest);renderHealth(state.newest);renderMetricCards();renderReadings(state.readings);renderNotice(state.newest);updateStatus(state.newest);}catch(error){$('status-dot').className='dot bad';$('status').textContent=error.message;$('metrics').innerHTML=`<div class="empty">${escapeHtml(error.message)}</div>`;}finally{$('refresh').disabled=false;} }
    $('filters').addEventListener('click',event=>{const button=event.target.closest('[data-filter]');if(!button)return;state.category=button.dataset.filter;renderFilters();renderMetricCards();});
    $('readings').addEventListener('click',event=>{const row=event.target.closest('.reading-row');if(row)toggleRequest(row);});
    $('metric-search').addEventListener('input',event=>{state.search=event.target.value;renderMetricCards();});$('device').addEventListener('change',load);$('history').addEventListener('change',load);$('refresh').addEventListener('click',load);renderFilters();load();setInterval(load,30000);
  </script>
</body>
