[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "imd-local"
version = "0.1.0"
description = "Local IMD product collection with documented field names and replaceable providers"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
system-trust = ["truststore>=0.10,<1"]
documents = ["pypdf>=5,<7"]
server = [
    "fastapi>=0.115,<1",
    "psycopg[binary]>=3.2,<4",
    "uvicorn[standard]>=0.34,<1",
]

[project.scripts]
imd = "imd_local.cli:main"

[tool.setuptools.packages.find]
include = ["imd_local*", "sensor_server*"]

[tool.setuptools.package-data]
imd_local = ["catalog.json"]
"imd_local.incois" = ["SOURCES.md"]
sensor_server = ["static/*.html"]
